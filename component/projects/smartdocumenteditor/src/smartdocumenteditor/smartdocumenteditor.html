<div [id]="servoyApi().getMarkupId()" class="document-container" #element >
  <div id="toolbar-container" class="toolbar-container"></div>
  @if (shouldshow() > 0) {
    <div class="editor-container" [ngStyle]="minHeight() ? {'min-height.px': minHeight()} : {}" >
      @if (!configChanging()) {
        <ckeditor #editor [config]="_cfg" [editor]="Editor" (ready)="onEditorReady($event)"></ckeditor>
      }
    </div>
  }
</div>
